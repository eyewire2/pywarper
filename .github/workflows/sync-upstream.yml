name: Sync main with upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN can't push commits touching .github/workflows/; SYNC_TOKEN
          # (Contents + Workflows write on this repo) can.
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Add upstream remote and sync
        run: |
          git remote add upstream https://github.com/berenslab/pywarper.git || git remote set-url upstream https://github.com/berenslab/pywarper.git
          git fetch upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin main
